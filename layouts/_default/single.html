{{ define "main" }}
<article>
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    <p class="meta">
      {{ .Date.Format "Jan 2, 2006" }}
      {{ with .Params.categories }}
        {{ range . }} · <a href="{{ "/categories/" | relURL }}{{ . | urlize }}/">{{ . }}</a>{{ end }}
      {{ end }}
    </p>
  </header>
  <div class="content">
    {{ .Content }}
  </div>
</article>
{{ partial "comments.html" . }}
{{ end }}
